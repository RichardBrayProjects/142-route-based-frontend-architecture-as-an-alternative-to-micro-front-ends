name: Deploy app

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy: shell, admin, billing, dashboard"
        required: true
        default: "shell"
  push:
    branches:
      - develop
      - staging
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/deploy-app.sh"
      - ".github/workflows/deploy-app.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      # For a real three-account setup, map branches to different role ARNs:
      # develop -> test account role
      # staging -> staging account role
      # main -> production account role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy selected app
        run: bash scripts/deploy-app.sh "${{ github.event.inputs.app || 'shell' }}"
